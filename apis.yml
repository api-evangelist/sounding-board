name: Sounding Board
description: >-
  Sounding Board is a leadership development company offering tech-powered coaching and mentoring
  solutions that help organizations develop dynamic leaders at every level. Its platform pairs software
  products (Expand, Guide, and Transform) with a global network of ICF/EMCC/IAC/CCE-certified coaches to
  deliver 1:1 coaching, group coaching, mentoring, and on-demand leadership development. Sounding Board
  serves technology, professional services, government, education, healthcare, financial services, and
  retail organizations, and was acquired by BTS in March 2025 to extend end-to-end executive-to-frontline
  coaching. Surfaced as a portfolio company of Bloomberg Beta and Canaan Partners; no public developer or
  API surface has been found to date.
